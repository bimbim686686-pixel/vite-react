<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Christmas Master Edition</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #FFD700; --red: #D32F2F; }
        body { margin: 0; overflow: hidden; background-color: #050d1a; font-family: 'Quicksand', sans-serif; }
        
        #canvas-container { width: 100vw; height: 100vh; }

        /* Giao diện UI từ file 2 & 3 */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; padding: 40px 0;
            z-index: 10;
        }

        .header-title {
            font-family: 'Great Vibes', cursive; font-size: 4rem;
            color: var(--gold); text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            margin: 0; opacity: 0; transition: opacity 2s;
        }

        .status-badge {
            background: rgba(0, 0, 0, 0.7); color: var(--gold);
            padding: 12px 25px; border-radius: 50px; border: 1.5px solid var(--gold);
            font-weight: bold; letter-spacing: 1px; box-shadow: 0 0 15px rgba(255,215,0,0.3);
            transform: translateY(20px); transition: all 0.5s;
        }

        #start-screen {
            position: absolute; inset: 0; background: rgba(5, 13, 26, 0.9);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; z-index: 100;
        }

        .btn-start {
            padding: 20px 60px; font-size: 24px; background: linear-gradient(45deg, var(--red), #8b0000);
            color: white; border: 2px solid var(--gold); border-radius: 50px;
            cursor: pointer; pointer-events: auto; font-weight: bold;
            box-shadow: 0 0 30px rgba(211, 47, 47, 0.5); transition: 0.3s;
        }
        .btn-start:hover { transform: scale(1.1); box-shadow: 0 0 50px rgba(211, 47, 47, 0.8); }

        #webcam-preview {
            position: fixed; bottom: 20px; right: 20px; width: 160px; height: 120px;
            border-radius: 15px; border: 2px solid var(--gold); transform: scaleX(-1);
            background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 50;
        }

        .instruction { color: #ccc; margin-top: 15px; font-size: 0.9rem; text-align: center; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="color: var(--gold); font-family: 'Great Vibes'; font-size: 5rem; margin-bottom: 30px;">Christmas Magic</h1>
        <button class="btn-start" onclick="initExperience()">START MAGIC</button>
        <div class="instruction">
            ✊ Nắm tay: Thu cây &nbsp; | &nbsp; 🖐 Xòe tay: Bung quà &nbsp; | &nbsp; 👌 Pinch: Xem ảnh <br>
            🤲 2 tay: Trái tim &nbsp; | &nbsp; ↔️ Vẫy tay: Xoay vòng ảnh
        </div>
    </div>

    <div id="ui-layer">
        <h1 id="main-title" class="header-title">Merry Christmas</h1>
        <div id="status" class="status-badge">System Ready</div>
    </div>

    <video class="input_video" style="display:none"></video>
    <canvas id="webcam-preview"></canvas>
    <div id="canvas-container"></div>

    <script>
        // --- CẤU HÌNH TÀI NGUYÊN ---
        const ASSETS = {
            audio: './audio.mp3',
            photos: ['./img/a1.jpg', './img/a2.jpg', './img/a3.jpg', './img/a4.jpg']
        };

        // --- BIẾN TOÀN CỤC ---
        let scene, camera, renderer, composer, clock = new THREE.Clock();
        let particles = [], snowParticles = [], photoMeshes = [];
        let state = { mode: 'TREE', handX: 0.5, lastHandX: 0.5, velocity: 0, rotationY: 0 };
        let audio = new Audio(ASSETS.audio); audio.loop = true;

        // --- LỚP HẠT VẬT LÝ (Từ File 2) ---
        class MagicParticle {
            constructor(index) {
                this.index = index;
                this.pos = new THREE.Vector3(0, -100, 0);
                this.vel = new THREE.Vector3();
                this.acc = new THREE.Vector3();
                this.maxSpeed = 2.0 + Math.random() * 2.0;
                this.maxForce = 0.1 + Math.random() * 0.1;
                this.friction = 0.95;
                
                // Lưu trữ các mục tiêu hình dạng
                this.targets = { tree: new THREE.Vector3(), heart: new THREE.Vector3(), explode: new THREE.Vector3() };
                this.initTargets();
            }

            initTargets() {
                // Hình cây thông (Conical)
                const h = Math.random() * 80;
                const r = (1 - h / 80) * 35 * Math.sqrt(Math.random());
                const theta = Math.random() * Math.PI * 2;
                this.targets.tree.set(r * Math.cos(theta), h - 40, r * Math.sin(theta));

                // Hình trái tim (Parametric)
                const t = Math.random() * Math.PI * 2;
                this.targets.heart.set(
                    16 * Math.pow(Math.sin(t), 3) * 2.2,
                    (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 2.2,
                    (Math.random()-0.5) * 10
                );

                // Hình vụ nổ (Spherical)
                const rad = 75 * Math.cbrt(Math.random());
                const phi = Math.acos(2 * Math.random() - 1), lam = 2 * Math.PI * Math.random();
                this.targets.explode.set(rad * Math.sin(phi) * Math.cos(lam), rad * Math.sin(phi) * Math.sin(lam), rad * Math.cos(phi));
            }

            update(mode) {
                const target = this.targets[mode.toLowerCase()] || this.targets.tree;
                
                // Lực hút vật lý (Steering force)
                let steer = new THREE.Vector3().subVectors(target, this.pos);
                let dist = steer.length();
                steer.normalize();
                
                if (dist < 20) steer.multiplyScalar(this.maxSpeed * (dist / 20));
                else steer.multiplyScalar(this.maxSpeed);
                
                let force = steer.sub(this.vel);
                force.clampLength(0, this.maxForce);
                
                this.acc.add(force);
                this.vel.add(this.acc);
                this.pos.add(this.vel);
                this.acc.set(0, 0, 0);
                this.vel.multiplyScalar(this.friction);
            }
        }

        // --- KHỞI TẠO HỆ THỐNG ---
        async function initExperience() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('main-title').style.opacity = '1';
            audio.play().catch(e => console.log("Audio play failed"));

            setupThree();
            setupPostProcessing();
            createObjects();
            setupMediaPipe();
            animate();
        }

        function setupThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050d1a, 0.002);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 0, 130);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);
        }

        function setupPostProcessing() {
            const renderScene = new THREE.RenderPass(scene, camera);
            
            // Hiệu ứng Bloom từ file 2 giúp hạt lấp lánh
            const bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight), 
                1.5, 0.4, 0.85
            );
            bloomPass.threshold = 0.2;
            bloomPass.strength = 1.2;
            bloomPass.radius = 0.5;

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);
        }

        function createObjects() {
            // 1. Tạo 2500 hạt Magic
            const geo = new THREE.BufferGeometry();
            const posArray = new Float32Array(2500 * 3);
            for (let i = 0; i < 2500; i++) {
                particles.push(new MagicParticle(i));
                posArray[i * 3] = 0; posArray[i * 3 + 1] = -100; posArray[i * 3 + 2] = 0;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            
            const mat = new THREE.PointsMaterial({
                size: 1.8, color: 0xFFD700, transparent: true, 
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            const points = new THREE.Points(geo, mat);
            scene.add(points);
            this.pointsSystem = points;

            // 2. Tạo Tuyết rơi
            const snowGeo = new THREE.BufferGeometry();
            const snowPos = new Float32Array(600 * 3);
            for(let i=0; i<600*3; i++) snowPos[i] = (Math.random()-0.5)*250;
            snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
            const snowMat = new THREE.PointsMaterial({ size: 0.8, color: 0xFFFFFF, transparent: true, opacity: 0.6 });
            const snow = new THREE.Points(snowGeo, snowMat);
            scene.add(snow);
            this.snowSystem = snow;

            // 3. Tạo Ảnh kỷ niệm
            const loader = new THREE.TextureLoader();
            ASSETS.photos.forEach((url, i) => {
                const mesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(15, 15),
                    new THREE.MeshBasicMaterial({ map: loader.load(url), side: THREE.DoubleSide })
                );
                // Thêm khung vàng cho ảnh
                const border = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), new THREE.MeshBasicMaterial({color: 0xFFD700}));
                border.position.z = -0.1; mesh.add(border);
                
                mesh.visible = false;
                scene.add(mesh);
                photoMeshes.push(mesh);
            });
        }

        // --- LOGIC NHẬN DIỆN TAY (Gộp File 1 & 3) ---
        function setupMediaPipe() {
            const video = document.querySelector('.input_video');
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            
            hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6 });

            hands.onResults(results => {
                const canvas = document.getElementById('webcam-preview');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

                if (results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    const currentX = lm[9].x;

                    // Tính vận tốc vuốt (Swipe) từ file 3
                    if (state.mode === 'EXPLODE') {
                        const deltaX = currentX - state.lastHandX;
                        state.velocity -= deltaX * 0.45;
                    }
                    state.lastHandX = currentX;
                    state.handX = currentX;

                    // Nhận diện trạng thái
                    const pinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                    const openDist = Math.hypot(lm[8].x - lm[0].x, lm[8].y - lm[0].y);

                    if (results.multiHandLandmarks.length === 2) {
                        updateState('HEART', "🤲 TRÁI TIM YÊU THƯƠNG");
                    } else if (openDist < 0.22) {
                        updateState('TREE', "✊ ĐANG THU CÂY THÔNG");
                    } else if (pinch < 0.05) {
                        updateState('PHOTO', "👌 ĐANG XEM ẢNH KỶ NIỆM");
                    } else {
                        updateState('EXPLODE', "🖐 VŨ TRỤ QUÀ TẶNG");
                    }
                } else {
                    updateState('TREE', "🎄 GIÁNG SINH AN LÀNH");
                }
            });

            const cameraUtils = new Camera(video, { onFrame: async () => { await hands.send({image: video}); }, width: 480, height: 360 });
            cameraUtils.start();
        }

        function updateState(mode, text) {
            state.mode = mode;
            const status = document.getElementById('status');
            status.innerText = text;
            status.style.borderColor = mode === 'HEART' ? '#ff3366' : '#FFD700';
            status.style.color = mode === 'HEART' ? '#ff3366' : '#FFD700';
        }

        // --- VÒNG LẶP CHÍNH ---
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const time = Date.now() * 0.001;

            // 1. Cập nhật Hạt Magic (Physics)
            const posAttr = this.pointsSystem.geometry.attributes.position;
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(state.mode);
                posAttr.array[i * 3] = particles[i].pos.x;
                posAttr.array[i * 3 + 1] = particles[i].pos.y;
                posAttr.array[i * 3 + 2] = particles[i].pos.z;
            }
            posAttr.needsUpdate = true;

            // 2. Logic Xoay & Gallery (File 3)
            if (state.mode === 'EXPLODE' || state.mode === 'PHOTO') {
                state.velocity *= 0.96; // Ma sát ảo
                state.rotationY += state.velocity + 0.005;
                this.pointsSystem.rotation.y = state.rotationY;
                
                photoMeshes.forEach((m, i) => {
                    m.visible = (state.mode !== 'PHOTO' || i === 0); // Đơn giản hóa: pinch xem ảnh đầu
                    if (state.mode === 'EXPLODE') {
                        const angle = state.rotationY + (i / photoMeshes.length) * Math.PI * 2;
                        m.position.set(Math.cos(angle)*45, Math.sin(time + i)*5, Math.sin(angle)*45);
                        m.scale.lerp(new THREE.Vector3(1,1,1), 0.1);
                    } else {
                        m.position.lerp(new THREE.Vector3(0, 0, 70), 0.1);
                        m.scale.lerp(new THREE.Vector3(3,3,3), 0.1);
                    }
                    m.lookAt(camera.position);
                });
            } else {
                this.pointsSystem.rotation.y += 0.01;
                photoMeshes.forEach(m => { m.visible = false; m.scale.set(0,0,0); });
            }

            // 3. Tuyết rơi (File 2)
            const snowAttr = this.snowSystem.geometry.attributes.position;
            for(let i=1; i<snowAttr.array.length; i+=3) {
                snowAttr.array[i] -= 0.3;
                if(snowAttr.array[i] < -100) snowAttr.array[i] = 100;
            }
            snowAttr.needsUpdate = true;

            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
